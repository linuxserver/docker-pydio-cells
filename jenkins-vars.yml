---

# jenkins variables
project_name: docker-pydio-cells
external_type: na
custom_version_command: "curl -sX GET https://api.github.com/repos/pydio/cells/releases | jq -r '.[] | select(.prerelease != true) | .tag_name' | sort -rV | head -1"
release_type: stable
release_tag: latest
ls_branch: master
repo_vars:
  - BUILD_VERSION_ARG = 'CELLS_RELEASE'
  - LS_USER = 'linuxserver'
  - LS_REPO = 'docker-pydio-cells'
  - CONTAINER_NAME = 'pydio-cells'
  - DOCKERHUB_IMAGE = 'linuxserver/pydio-cells'
  - DEV_DOCKERHUB_IMAGE = 'lsiodev/pydio-cells'
  - PR_DOCKERHUB_IMAGE = 'lspipepr/pydio-cells'
  - DIST_IMAGE = 'alpine'
  - MULTIARCH='true'
  - CI='true'
  - CI_WEB='true'
  - CI_PORT='8080'
  - CI_SSL='true'
  - CI_DELAY='120'
  - CI_DOCKERENV='EXTERNALURL=https://localhost:8080'
  - CI_AUTH=''
  - CI_WEBPATH=''
